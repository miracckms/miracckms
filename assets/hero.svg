<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
<defs>
  <clipPath id="card"><rect width="1000" height="330" rx="18"/></clipPath>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7aa2f7" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#bb9af7" stop-opacity=".15"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7aa2f7"/><stop offset=".5" stop-color="#bb9af7"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  <linearGradient id="name" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#7aa2f7"/><stop offset=".65" stop-color="#bb9af7"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#bb9af7" stop-opacity=".9"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
  <linearGradient id="gridfade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".6" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="gm"><rect width="1000" height="330" fill="url(#gridfade)"/></mask>

</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  
  .in { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 810px 165px; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
  .wave { animation: wave 2.4s ease-in-out 1.2s 2; transform-origin: 66px 84px; display: inline-block; }
  @keyframes wave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(16deg); } 75% { transform: rotate(-8deg); } }

</style>
<g clip-path="url(#card)">
  <rect width="1000" height="330" fill="#0b0e1a"/>
  
  <g filter="url(#blur)"><circle cx="120" cy="40" r="170" fill="#7aa2f7" opacity="0.38"><animateTransform attributeName="transform" type="translate" values="0 0;70 40;0 0" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="560" cy="300" r="160" fill="#bb9af7" opacity="0.32"><animateTransform attributeName="transform" type="translate" values="0 0;-60 -50;0 0" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="880" cy="60" r="150" fill="#f472b6" opacity="0.22"><animateTransform attributeName="transform" type="translate" values="0 0;-40 60;0 0" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="980" cy="300" r="120" fill="#7dcfff" opacity="0.16"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle></g>
  <rect width="1000" height="330" fill="url(#grid)" mask="url(#gm)"/>
  <g class="in" style="animation-delay:.15s">
    <text x="56" y="92" font-size="14" font-weight="700" letter-spacing="3" fill="#7aa2f7">HI THERE, I'M</text>
  </g>
  <g class="in" style="animation-delay:.35s">
    <text x="52" y="160" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Miraç Çekmiş</text>
  </g>
  <g class="in" style="animation-delay:.65s">
    <text x="56" y="204" font-size="22" font-weight="500" fill="#c0caf5">Software Team Lead <tspan fill="#bb9af7">·</tspan> Full Stack Developer</text>
  </g>
  <g class="in" style="animation-delay:1.10s"><rect x="56" y="236" width="63" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#bb9af7" stroke-opacity=".35"/><text x="87" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#c0caf5">Java</text></g><g class="in" style="animation-delay:1.22s"><rect x="128.8" y="236" width="120" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#bb9af7" stroke-opacity=".35"/><text x="189" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#c0caf5">Spring Boot</text></g><g class="in" style="animation-delay:1.34s"><rect x="259.0" y="236" width="79" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#bb9af7" stroke-opacity=".35"/><text x="299" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#c0caf5">Vue.js</text></g><g class="in" style="animation-delay:1.46s"><rect x="348.2" y="236" width="71" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#bb9af7" stroke-opacity=".35"/><text x="384" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#c0caf5">React</text></g><g class="in" style="animation-delay:1.58s"><rect x="429.2" y="236" width="55" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#bb9af7" stroke-opacity=".35"/><text x="456" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#c0caf5">AWS</text></g><g class="in" style="animation-delay:1.70s"><rect x="493.79999999999995" y="236" width="112" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#bb9af7" stroke-opacity=".35"/><text x="550" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#c0caf5">Kubernetes</text></g>
  <g class="in" style="animation-delay:1.9s">
    <circle cx="62" cy="297" r="4" fill="#9ece6a"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="74" y="302" font-size="13.5" fill="#737aa2">Istanbul, Türkiye  ·  Building &amp; leading high-performance teams</text>
  </g>
  <g class="in" style="animation-delay:.5s">
    <circle cx="810" cy="165" r="62" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-dasharray=""/><circle cx="810" cy="165" r="102" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-dasharray="3 7"/><circle cx="810" cy="165" r="142" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-dasharray="1 9"/>
    <circle cx="810" cy="165" r="46" fill="url(#core)" filter="url(#glow)" class="pulse"/>
    <circle cx="810" cy="165" r="34" fill="#0b0e1a" stroke="url(#brand)" stroke-width="2"/>
    <text x="810" y="173" text-anchor="middle" font-size="22" font-weight="800" fill="url(#brand)" class="mono">MÇ</text>
    <g><animateTransform attributeName="transform" type="rotate" from="0 810 165" to="360 810 165" dur="9s" repeatCount="indefinite"/><g transform="translate(872 165)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="9s" repeatCount="indefinite"/><circle r="17" fill="#0b0e1a" stroke="#7aa2f7" stroke-width="1.5"/><circle r="17" fill="#7aa2f7" fill-opacity=".12"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7aa2f7" class="mono">{ }</text></g></g></g><g><animateTransform attributeName="transform" type="rotate" from="120 810 165" to="480 810 165" dur="14s" repeatCount="indefinite"/><g transform="translate(912 165)"><g><animateTransform attributeName="transform" type="rotate" from="-120 0 0" to="-480 0 0" dur="14s" repeatCount="indefinite"/><circle r="17" fill="#0b0e1a" stroke="#bb9af7" stroke-width="1.5"/><circle r="17" fill="#bb9af7" fill-opacity=".12"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#bb9af7" class="mono">λ</text></g></g></g><g><animateTransform attributeName="transform" type="rotate" from="300 810 165" to="660 810 165" dur="14s" repeatCount="indefinite"/><g transform="translate(912 165)"><g><animateTransform attributeName="transform" type="rotate" from="-300 0 0" to="-660 0 0" dur="14s" repeatCount="indefinite"/><circle r="17" fill="#0b0e1a" stroke="#f472b6" stroke-width="1.5"/><circle r="17" fill="#f472b6" fill-opacity=".12"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#f472b6" class="mono">AI</text></g></g></g><g><animateTransform attributeName="transform" type="rotate" from="40 810 165" to="400 810 165" dur="22s" repeatCount="indefinite"/><g transform="translate(952 165)"><g><animateTransform attributeName="transform" type="rotate" from="-40 0 0" to="-400 0 0" dur="22s" repeatCount="indefinite"/><circle r="17" fill="#0b0e1a" stroke="#7dcfff" stroke-width="1.5"/><circle r="17" fill="#7dcfff" fill-opacity=".12"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7dcfff" class="mono">&lt;/&gt;</text></g></g></g><g><animateTransform attributeName="transform" type="rotate" from="220 810 165" to="580 810 165" dur="22s" repeatCount="indefinite"/><g transform="translate(952 165)"><g><animateTransform attributeName="transform" type="rotate" from="-220 0 0" to="-580 0 0" dur="22s" repeatCount="indefinite"/><circle r="17" fill="#0b0e1a" stroke="#9ece6a" stroke-width="1.5"/><circle r="17" fill="#9ece6a" fill-opacity=".12"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9ece6a" class="mono">k8s</text></g></g></g>
  </g>

</g>
<rect x=".75" y=".75" width="998.5" height="328.5" rx="17.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>
</svg>
